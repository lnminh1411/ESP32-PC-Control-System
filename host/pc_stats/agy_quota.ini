# agy_quota.ini: Configuration for the Google Antigravity quota reader (the user-session half of ESP32-Helper.exe)
# Monitored and hot-reloaded automatically when LastWriteTime changes.

# Poll interval in milliseconds (default: 60000 = 1 minute)
interval_ms = 60000

# Accounts to map to slots agy1, agy2, ... in order
# If omitted, defaults to sorted emails in %USERPROFILE%\.gemini\antigravity-cli\accounts\
accounts = nhatminh.forwarding@gmail.com, nhatminh.fowarding@gmail.com

# Model family classification regexes (case-insensitive)
# Models matching 'exclude' are ignored.
# Other models are assigned to the first family whose regex matches.
exclude = claude|gpt|oss
flash = flash
pro = \bpro\b|argon|ultra

# Last-known quota, reloaded at start so a closed client keeps its values (the
# service gets live values over the pipe, not from this file)
output = C:\ProgramData\ESP32PcStats\agy_quota.txt
