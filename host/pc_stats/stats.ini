# stats.ini: Config-driven PC statistics streamed to ESP32-S3 carrier board
#
# Format:
#   key = @feed [<feed key>]                     (PcHwCtl's sensor feed, default the same key)
#   key = @ram load|used|free                    (physical memory: used %, GB)
#   key = @net down|up <adapter,...>             (bytes/s summed over adapters, '*' wildcards)
#   key = @uptime                                (seconds, via GetTickCount64)
#   key = @drive <letter>: used|free|total|load  (GB, load = used %, via DriveInfo)
#   key = @cpu_mhz                               (Task Manager's CPU speed, free)
#   key = @ecore_load                            (average % Processor Time on E-cores)
#   key = @proc_mb <name>                        (summed WorkingSet64 of processes in MB)
#   key = @counter <category> | <counter> | <instance> [| scale]   (any Windows perf counter)
#   @source <name> <url> <ms>                    (poll HTTP/file key=value stream on background thread)
#
# Hardware sensors (temperatures, fans, GPU, power) come from PcHwCtl
# (E:\PC Hardware Controller), the only LibreHardwareMonitor reader on this
# PC: the helper subscribes to its sensor feed over \\.\pipe\PcHwCtl. Which
# sensor feeds which key, and how often, is PcHwCtl's config (feed.keys,
# feed.every). A feed key with no reading, or the feed down for 3 s, goes out
# empty (NaN on the board).
#
# Run 'ESP32-Helper.exe --list' to print the feed's keys and current values.
# Keys: [a-z0-9_.], max 23 chars.

# Sample interval in ms (200-10000)
@interval 500

# Uptime / System
uptime         = @uptime

# CPU (clock and load from Windows counters, which cost nothing)
cpu_temp       = @feed
cpu_load       = @counter Processor Information | % Processor Time | _Total   # busy time, all cores (Utility is clock-scaled, goes past 100%)
cpu_ecore_load = @ecore_load
cpu_clock      = @cpu_mhz
cpu_power      = @feed

# Fans: CPU_FAN header, SYS_FAN2 (front fans); VRM MOS temperature (IT8696E)
cpu_fan        = @feed
sys_fan        = @feed
vrm_temp       = @feed

# RAM
ram_load       = @ram load
ram_temp       = @feed                             # hottest DIMM (SPD sensor)
ram_used       = @ram used
ram_free       = @ram free

# GPUs: GPU 1 = RX 6600, GPU 2 = RTX 3050, igpu_load = busiest Intel D3D engine
gpu1_temp      = @feed
gpu1_fan       = @feed
gpu1_clock     = @feed
gpu1_load      = @feed
gpu1_vram      = @feed
gpu1_vramt     = @feed
gpu1_power     = @feed
gpu2_temp      = @feed
gpu2_fan       = @feed
gpu2_clock     = @feed
gpu2_load      = @feed
gpu2_vram      = @feed
gpu2_vramt     = @feed
gpu2_power     = @feed
igpu_load      = @feed

# Drive
c_used         = @drive C: used
c_total        = @drive C: total

# Network
net_down       = @net down Wi-Fi,Ethernet   # bytes/s
net_up         = @net up Wi-Fi,Ethernet

# Local AI (status hub)
# Every ai.* key from E:\Local LLM\StatusHub.md is forwarded (e.g. ai.phase,
# ai.gen_tok_s, ai.tool). Numbers stream in @s, text in @t. ai.ok is 1 when
# the hub is reachable within 3 s, else 0 and other ai.* keys are dropped.
@source ai http://127.0.0.1:8080/_gate/ai/flat 1000
llm_ram_mb     = @proc_mb llama-server

# PC hardware control (PcHwCtl, E:\PC Hardware Controller): fan and RGB state
# it writes every second, e.g. hw.cpu_fans.rpm, hw.rgb.main, hw.rgb.bright.
# The board changes RGB with !hw (PcHwCtl's pipe); the answer comes back as hw.reply.
# Its monitors (hw.mon.*) go to the board as mon.*: mon.count, mon.<n>.name,
# mon.<n>.main, mon.<n>.bright, mon.<n>.power; its display-required power
# request (hw.disp_req*) as pc.disp_req and pc.disp_req_by. !mon and !night
# become its display / aff / lasso commands.
@source hw file:///C:/ProgramData/PcHwCtl/state.txt 1000

# Antigravity quota (from the user-session half of ESP32-Helper.exe, over its pipe)
@source agy helper:agy 5000

# Media playback & cover art (from the user-session half of ESP32-Helper.exe, over its pipe)
@source media helper:media 250

# Seconds since the last keyboard/mouse input (user-session half, Idle.cs), for
# the board's night mode: pc.idle_s, pc.in_px, pc.in_press
@source idle helper:idle 1000

# Claude usage
# Streams session/weekly % limits, reset times, pace, and local token/cost totals.
#   claude.ok          1 if live data is fresh (fetched within 3 x live_ms), else 0
#   claude.stale       1 if showing last-known live values after an error
#   claude.s_pct       session (5h) utilization %
#   claude.s_reset_s   seconds until the 5h window resets (from resets_at, now)
#   claude.s_pace      projected % at reset (aiusage compute_pace), omit if none
#   claude.w_pct       weekly (7d) utilization %
#   claude.w_reset_s   seconds until the weekly reset
#   claude.w_pace      projected weekly % at reset
#   claude.w_<m>_pct   per weekly_scoped model, model lowercased, [a-z0-9] only, trimmed to fit 23 chars (e.g. claude.w_sonnet_pct)
#   claude.x_pct       extra usage % (only when enabled)
#   claude.tok_5h      tokens in the last 5 h (local logs)
#   claude.tok_today   tokens since local midnight
#   claude.tok_7d      tokens in the last 7 days
#   claude.tok_30d     tokens in the last 30 days
#   claude.usd_today   estimated $ since local midnight
#   claude.usd_30d     estimated $ last 30 days
#   claude.plan        plan name (e.g. Pro, Max 5x) [@t]
#   claude.s_reset_at  local time of the 5h reset, "HH:mm" [@t]
#   claude.w_reset_at  local weekly reset, "ddd dd MMM HH:mm" (InvariantCulture) [@t]
#   claude.s_pace_v    session pace verdict: ok|tight|over [@t]
#   claude.w_pace_v    weekly pace verdict: ok|tight|over [@t]
#   claude.err         "" when fine, else token_expired|not_logged_in|rate_limited|request_failed|no_credentials [@t]
@claude C:\Users\lnminh1411\.claude 120000

# Host-published text stats (streamed automatically in @t, not configured here):
#   pc.mac             Primary wired Ethernet adapter MAC (AA:BB:CC:DD:EE:FF)
#   pc.mac_if          Primary adapter interface name (<= 80 chars)
#   power.ack          Ack for !power <action> <nonce> commands (<action> <nonce> or error <nonce> <reason>)
