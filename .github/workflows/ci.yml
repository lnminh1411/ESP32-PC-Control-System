name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - name: Firmware pin map matches pcb/main.ato
        run: python scripts/check_pins.py
      - name: Lint scripts
        run: python -m pyflakes scripts
